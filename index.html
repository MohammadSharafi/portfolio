    <script>
      // Applies the stored theme before first paint so a dark-mode visitor never
      // sees a white flash. Kept inline and dependency-free on purpose.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (error) {
          /* Storage unavailable — fall back to the CSS default. */
        }
      })();
    </script>
